name: Release

on:
  push:
    tags:
      - 'V*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: pac-man-linux
            zip_name: pac-man-linux.zip

          - os: windows-latest
            artifact_name: pac-man-windows
            zip_name: pac-man-windows.zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync

      - name: Build Linux
        if: runner.os == 'Linux'
        run: make package

      - name: Build Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          uv run pyinstaller --noconfirm --clean `
            --workpath build/pyinstaller `
            --distpath dist/windows `
            pac-man.spec

          Copy-Item config.json dist/windows/pac-man/config.json
          Set-Content dist/windows/pac-man/scores.json "[]"
          Copy-Item README.md dist/windows/pac-man/README.txt

          Compress-Archive `
            -Path dist/windows/pac-man `
            -DestinationPath dist/windows/pac-man-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/linux/pac-man-linux.zip
            dist/windows/pac-man-windows.zip

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: false
          files: |
            artifacts/pac-man-linux/pac-man-linux.zip
            artifacts/pac-man-windows/pac-man-windows.zip